[package]
name = "meowsystem-ascii-battery"
version = "1.3.0"
edition = "2021"
authors = ["pewmoe (upstream)", "Vitória Maria", "André Farias"]
license = "MPL-2.0"
description = "Battery style applet for cosmic desktop. A fork of pewmoe/Cosmic-Desktop-ASCII-Battery-Applet themed by MeowSystem."

repository = "https://github.com/vitoriamariadb/meowsystem-ascii-battery"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "macros"] }
zbus = { version = "5", features = ["blocking-api"] }
starship-battery = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
cosmic-config = { git = "https://github.com/pop-os/libcosmic.git" }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
]
